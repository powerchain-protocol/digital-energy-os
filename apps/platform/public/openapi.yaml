openapi: 3.1.0
info:
  title: PowerChain API
  version: 1.0.0
  description: Versioned APIs for the PowerChain Renewable Energy Operating System, including identity, AI, Proof of Energy, tokenization, cross-chain
    PWRC, marketplace settlement, smart meters, carbon, telemetry and platform configuration.
servers:
- url: /api/v1
security:
- sessionCookie: []
tags:
- name: Identity
- name: AI
- name: Energy
- name: Tokens
- name: Bridge
- name: Marketplace
- name: Settlement
- name: Platform
- name: Control Plane
- name: Integrations
- name: Treasury
- name: Operations
paths:
  /auth/signin:
    post:
      tags:
      - Identity
      summary: Sign in with email and password
      responses:
        '200':
          description: Session created
        '400':
          description: Invalid request
  /auth/signup:
    post:
      tags:
      - Identity
      summary: Create a user and organization account
      responses:
        '201':
          description: Account created
  /sessions:
    get:
      tags:
      - Identity
      summary: Read the current authenticated session
      responses:
        '200':
          description: Session state
  /ai/models:
    get:
      tags:
      - AI
      summary: List GRIDLLM, LoRA and retrieval models
      responses:
        '200':
          description: AI model catalog
  /ai/agents:
    get:
      tags:
      - AI
      summary: List PowerChain renewable-energy agents and skills
      responses:
        '200':
          description: Agent catalog
  /ai/settings:
    get:
      tags:
      - AI
      summary: Read public PowerChain AI configuration
      responses:
        '200':
          description: AI configuration
  /chat:
    post:
      tags:
      - AI
      summary: Submit a PowerChain-scoped AI message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - message
              properties:
                chatId:
                  type:
                  - string
                  - 'null'
                message:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '200':
          description: Assistant response
        '400':
          description: Prompt is invalid or outside PowerChain scope
      description: Uses the authenticated session/tenant identity; caller-controlled user identity is not accepted.
  /measurements:
    post:
      tags:
      - Energy
      summary: Submit a signed smart-meter measurement
      responses:
        '201':
          description: Measurement accepted
  /measurements/batch:
    post:
      tags:
      - Energy
      summary: Submit a batch of smart-meter measurements
      responses:
        '201':
          description: Measurements accepted
  /attestations:
    post:
      tags:
      - Energy
      summary: Create a DePIN oracle attestation
      responses:
        '201':
          description: Attestation created
  /proof-of-energy/verify:
    post:
      tags:
      - Energy
      summary: Verify an energy measurement and oracle consensus
      responses:
        '200':
          description: Verification result
  /tokens/energy/mint:
    post:
      tags:
      - Tokens
      summary: Mint a verified kWh or MWh token
      responses:
        '201':
          description: Energy token prepared or minted
  /tokens/energy/burn:
    post:
      tags:
      - Tokens
      summary: Burn an energy token
      responses:
        '200':
          description: Burn recorded
  /tokens/energy/retire:
    post:
      tags:
      - Tokens
      summary: Retire an energy token and preserve provenance
      responses:
        '200':
          description: Retirement recorded
  /bridge/pwrc/quote:
    get:
      tags:
      - Bridge
      summary: "Quote a PowerChain \u2194 Solana PWRC transfer"
      parameters:
      - in: query
        name: direction
        required: true
        schema:
          type: string
          enum:
          - powerchain-to-solana
          - solana-to-powerchain
      - in: query
        name: amount
        required: true
        schema:
          type: string
          example: '1000.0'
      responses:
        '200':
          description: Bridge quote
        '400':
          description: Invalid direction or amount
  /bridge/pwrc/transfer:
    post:
      tags:
      - Bridge
      summary: Prepare a signature-required PWRC bridge transfer
      description: Solana PWRC circulating supply must never exceed native PWRC locked for the Solana integration.
      responses:
        '201':
          description: Transfer prepared
        '400':
          description: Validation error
  /marketplace/orders:
    post:
      tags:
      - Marketplace
      summary: Create a marketplace order
      responses:
        '201':
          description: Order created
  /settlements:
    post:
      tags:
      - Settlement
      summary: Create a signature-required settlement
      responses:
        '201':
          description: Settlement created
  /transactions:
    post:
      tags:
      - Settlement
      summary: Prepare a validated Solana, Sui or EVM transaction
      responses:
        '201':
          description: Transaction prepared
        '400':
          description: Validation error
  /status:
    get:
      tags:
      - Platform
      summary: Read platform and integration status
      responses:
        '200':
          description: Platform status
  /config/networks:
    get:
      tags:
      - Platform
      summary: List supported Solana and Sui networks without secrets
      responses:
        '200':
          description: Network catalog
  /certification/programs:
    get:
      summary: List certification programs
      responses:
        '200':
          description: Certification programs
  /certification/certificates:
    get:
      summary: List tokenized certificates
      responses:
        '200':
          description: Certificates
    post:
      summary: Request certificate issuance
      responses:
        '202':
          description: Issuance accepted
  /energy/prices:
    get:
      summary: Fetch sourced regional energy prices and tariffs
      parameters:
      - in: query
        name: region
        schema:
          type: string
      responses:
        '200':
          description: Explicit provider-state price records
  /payments:
    post:
      summary: Create a decimal-safe payment authorization
      responses:
        '201':
          description: Payment authorization created
  /ems:
    get:
      tags:
      - Energy
      summary: Read tenant EMS operator state
      responses:
        '200':
          description: EMS state
  /erp:
    get:
      tags:
      - Platform
      summary: Read ERP operator state
      responses:
        '200':
          description: ERP state
  /cmr:
    get:
      tags:
      - Platform
      summary: Read CMR operator state
      responses:
        '200':
          description: CMR state
  /rewards:
    get:
      tags:
      - Platform
      summary: Read evidence-backed reward state
      responses:
        '200':
          description: Reward state
  /treasury:
    get:
      tags:
      - Settlement
      summary: Read treasury operator state
      responses:
        '200':
          description: Treasury state
  /vault:
    get:
      tags:
      - Platform
      summary: Read evidence vault state
      responses:
        '200':
          description: Vault state
  /local-energy/listings:
    get:
      tags:
      - Energy
      summary: List integer-Wh Local Energy BUY/SELL/RENT listings
      responses:
        '200':
          description: Listings
    post:
      tags:
      - Energy
      summary: Create a Local Energy listing
      responses:
        '201':
          description: Listing created
  /local-energy/reservations:
    post:
      tags:
      - Energy
      summary: Reserve Local Energy Wh using idempotency and listing-version CAS
      responses:
        '201':
          description: Review-required reservation
      description: Atomically reserve integer Wh using Idempotency-Key and expected listing version. The accepted reservation is REVIEW_REQUIRED,
        not delivered or settled.
    get:
      tags:
      - Energy
      summary: List authenticated Local Energy reservations
      responses:
        '200':
          description: Success
        '400':
          description: Validated request error
        '401':
          description: Authentication required
      description: Reservation state is independent from delivery, reconciliation and financial settlement.
  /copilot/credits/rates:
    get:
      tags:
      - AI
      summary: Read sourced SOL/USD and EUR/USD display rates
      responses:
        '200':
          description: Credit market rates
  /copilot/credits/quote:
    post:
      tags:
      - AI
      summary: Quote a Copilot message in USD/EUR/SOL/PWRC
      responses:
        '200':
          description: Credit quote
  /solana/tokens/search:
    get:
      tags:
      - Tokens
      summary: Search Jupiter Token API v2
      responses:
        '200':
          description: Token search result
  /solana/swap/quote:
    post:
      tags:
      - Tokens
      summary: Request a Jupiter swap quote without signing
      responses:
        '200':
          description: Quote result
  /tokens/framework:
    get:
      tags:
      - Tokens
      summary: Read PowerChain token standards and Solana program IDs
      responses:
        '200':
          description: Token framework
      description: Returns canonical SPL, Token-2022, Metaplex, Pyth, Jupiter and Helium integration metadata plus CCT configuration state.
  /tokens/cct/issuance-intents:
    post:
      tags:
      - Tokens
      summary: Prepare an evidence-backed CCT issuance intent for review
      responses:
        '202':
          description: Review-required issuance intent
      description: Creates an approval-controlled Token-2022 CCT issuance intent backed by verified evidence. This endpoint does not sign or mint.
  /energy-network/search:
    get:
      tags:
      - Energy
      summary: Search PowerChain Energy Network participants
      responses:
        '200':
          description: Success
        '400':
          description: Validated request error
        '401':
          description: Authentication required
      description: Search consumers, prosumers, retailers, renewable generators, utilities, grid operators, communities and partners with tenant/public-profile
        boundaries.
  /web3/programs:
    get:
      tags:
      - Tokens
      summary: List canonical Solana, Metaplex, Pyth, Jupiter and Helium program identifiers
      responses:
        '200':
          description: Success
        '400':
          description: Validated request error
        '401':
          description: Authentication required
      description: Reference metadata only; program IDs do not grant wallet authority.
  /integrations/jupiter/tokens:
    get:
      tags:
      - Tokens
      summary: Search Jupiter Tokens V2
      responses:
        '200':
          description: Success
        '400':
          description: Validated request error
        '401':
          description: Authentication required
      description: Read-only token discovery through the PowerChain integration boundary.
  /integrations/jupiter/price:
    get:
      tags:
      - Tokens
      summary: Read Jupiter Price V3 values
      responses:
        '200':
          description: Success
        '400':
          description: Validated request error
        '401':
          description: Authentication required
      description: Sourced price display data; not settlement authority.
  /asset-graph:
    get:
      tags:
      - Platform
      summary: Read the organization-scoped Asset Graph
      responses:
        '200':
          description: Success
        '400':
          description: Validated request error
        '401':
          description: Authentication required
      description: Graph nodes and relationships are assembled only from tenant-scoped persisted PowerChain records.
  /control-plane/agents/energy:
    get:
      tags:
      - AI
      summary: Read Energy Agent manifest and autonomy limits
      responses:
        '200':
          description: Success
        '400':
          description: Validated request error
        '401':
          description: Authentication required
      description: The Energy Agent cannot sign wallets or directly execute treasury/token actions.
  /control-plane/intents/evaluate:
    post:
      tags:
      - AI
      summary: Evaluate an Action Intent through the Control Plane
      responses:
        '200':
          description: Success
        '400':
          description: Validated request error
        '401':
          description: Authentication required
        '202':
          description: Accepted / prepared
      description: Evaluation produces a policy/approval decision only; it performs no external execution.
  /revenue/preview:
    post:
      tags:
      - Energy
      summary: Preview deterministic renewable revenue and allocation
      responses:
        '200':
          description: Success
        '400':
          description: Validated request error
        '401':
          description: Authentication required
        '202':
          description: Accepted / prepared
      description: Preview-only integer/precise arithmetic. No treasury or settlement mutation is performed.
  /copilot/credits:
    get:
      tags:
      - AI
      summary: Read PWRC-backed Copilot credit account
      responses:
        '200':
          description: Success
        '400':
          description: Validated request error
        '401':
          description: Authentication required
      description: Returns available/reserved/total PWRC credit state for the authenticated organization/user context.
  /copilot/credits/purchase-intent:
    post:
      tags:
      - AI
      summary: Prepare a PWRC/Copilot credit purchase intent
      responses:
        '200':
          description: Success
        '400':
          description: Validated request error
        '401':
          description: Authentication required
        '202':
          description: Accepted / prepared
      description: Preparing a purchase intent never credits the account before confirmed funding evidence.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: powerchain_session
