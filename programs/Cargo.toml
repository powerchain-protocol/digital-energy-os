[package]
name = "powerchain-registry"
version = "0.2.0"
edition = "2021"
description = "PowerChain renewable-energy registry, metering, DePIN, treasury and exchange program"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "powerchain_registry"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"
