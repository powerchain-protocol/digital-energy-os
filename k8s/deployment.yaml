apiVersion: apps/v1
kind: Deployment
metadata: { name: powerchain-platform }
spec:
  replicas: 3
  selector: { matchLabels: { app: powerchain-platform } }
  template:
    metadata: { labels: { app: powerchain-platform } }
    spec:
      containers:
        - name: web
          image: powerchain/platform:1.0.0-beta.6
          ports: [{ containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /api/v1/readiness, port: 3000 }, initialDelaySeconds: 10 }
          livenessProbe: { httpGet: { path: /api/v1/health, port: 3000 }, initialDelaySeconds: 20 }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata: { name: powerchain-platform }
spec:
  selector: { app: powerchain-platform }
  ports: [{ port: 80, targetPort: 3000 }]
